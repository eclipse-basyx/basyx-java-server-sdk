services:
  aas-repository:
    image: test/aas-repository:$BASYX_VERSION
    container_name: test_aas_repository
    environment:
      - SERVER_PORT=8081
      - SPRING_MONGODB_HOST=mongo
      - SPRING_MONGODB_DATABASE=aasrepo
      - SPRING_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_MONGODB_USERNAME=mongoAdmin
      - SPRING_MONGODB_PASSWORD=mongoPassword
      - BASYX_BACKEND=MongoDB
    ports:
      - '8081:8081'
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    # mongo:8 (8.3) and 8.0 refuse to start on Linux kernel 6.19+, see https://jira.mongodb.org/browse/SERVER-121912
    image: mongo:8.2.12
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 })\" || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
